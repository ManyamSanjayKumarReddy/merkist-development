name: self-hosted

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          rsync -av --exclude='.env' --exclude='.git' $GITHUB_WORKSPACE/ /opt/merkist-development/
          cd /opt/merkist-development
          docker compose up --build -d
          until docker compose exec -T api python -c "import app" 2>/dev/null; do sleep 2; done
          docker compose exec -T api .venv/bin/aerich upgrade || true
          docker image prune -f